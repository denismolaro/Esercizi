<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Palestra</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<meta name="theme-color" content="#14202E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202E; --ink-soft:#41556B; --paper:#EEF2F5; --card:#fff; --line:#D7DFE6;
  --a1:#0E7C86; --a1b:#E2F2F3;
  --a2:#B06A08; --a2b:#FBEEDA;
  --a3:#6244C0; --a3b:#EBE7FA;
  --ok:#12703F; --okb:#E3F3E9;
  --wait:#8A5A12; --waitb:#FBF0DC;
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5;
  padding-bottom:calc(46px + var(--safe-b));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
header{
  background:var(--ink); color:#fff;
  padding:calc(16px + var(--safe-t)) 0 15px; margin-bottom:16px;
  border-bottom:5px solid var(--a2);
}
.hrow{display:flex;align-items:center;gap:12px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:23px;margin:0;letter-spacing:-.01em;flex:1}
.back{background:none;border:none;color:#AFC0D0;font-family:inherit;font-size:15px;cursor:pointer;padding:6px 2px}
.sub{margin:5px 0 0;font-size:14px;color:#AFC0D0}
.spine{display:flex;gap:5px;margin-top:12px}
.spine span{height:5px;border-radius:3px;flex:1}
.sa{background:var(--a1)}.sb{background:var(--a2)}.sc{background:var(--a3)}

button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.note{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:14.5px;color:var(--ink-soft);margin-bottom:14px}
.note b{color:var(--ink)}
.cta{width:100%;padding:15px;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.cta.small{padding:11px;font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.center{text-align:center}
.muted{color:var(--ink-soft);font-size:14px}
.linkish{background:none;border:none;font-size:13.5px;color:var(--a1);text-decoration:underline;cursor:pointer;padding:4px 0}

/* elenco pacchetti */
.packbtn{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-left:6px solid var(--a1); border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;
}
.packbtn .k{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a1);margin-bottom:3px}
.packbtn .t{font-size:18px;font-weight:700;line-height:1.25;display:block}
.packbtn .b{font-size:14px;color:var(--ink-soft);margin-top:3px;display:block}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.subj-0{border-left-color:var(--a1)} .subj-0 .k{color:var(--a1)}
.subj-1{border-left-color:var(--a2)} .subj-1 .k{color:var(--a2)}
.subj-2{border-left-color:var(--a3)} .subj-2 .k{color:var(--a3)}
/* titoli di sezione nella pagina iniziale */
.sect{display:flex;align-items:center;gap:10px;margin:22px 0 10px;
  font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--a1)}
.sect i{flex:1;height:1px;background:var(--line);display:block}
.sect.first{margin-top:4px}
.sect.s-0{color:var(--a1)} .sect.s-1{color:var(--a2)} .sect.s-2{color:var(--a3)}

/* schede a tre forme */
.trio{display:grid;gap:7px}
.form{border:none;border-radius:11px;padding:9px 5px 10px;text-align:center;cursor:pointer;display:block;width:100%}
.form .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85;margin-bottom:3px}
.form .word{display:block;font-size:18px;font-weight:700;line-height:1.15;word-break:break-word}
.form .ph{display:block;font-size:12px;opacity:.8;margin-top:3px;font-style:italic}
.form .spk{display:block;font-size:11px;margin-top:5px;opacity:.75}
.f0{background:var(--a1b);color:var(--a1)} .f1{background:var(--a2b);color:var(--a2)} .f2{background:var(--a3b);color:var(--a3)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}
.meaning{font-size:15px;color:var(--ink-soft)} .meaning b{color:var(--ink);font-size:16.5px}
.trap{margin-top:10px;background:var(--waitb);color:var(--wait);border-radius:9px;padding:8px 10px;font-size:13.5px}

/* chip gruppi */
.groups{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

/* sessione */
.dots{display:flex;gap:4px;margin-bottom:14px}
.dots i{height:6px;flex:1;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--a1)} .dots i.miss{background:var(--wait)} .dots i.now{background:var(--ink)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.qlab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.qbig{font-family:Fraunces,Georgia,serif;font-size:27px;font-weight:700;line-height:1.2;margin:0 0 5px;word-break:break-word}
.qsub{font-size:14.5px;color:var(--ink-soft);margin:0}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;padding:14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer}
.opt.right{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opt.wrongpick{background:var(--waitb);border-color:var(--wait);color:var(--wait)}
.opt.dim{opacity:.45}
.opt .n{display:inline-block;min-width:22px;color:var(--ink-soft);font-weight:400;font-size:15px}
.verdict{border-radius:var(--r);padding:13px 15px;margin-bottom:12px;font-size:16px;font-weight:700}
.verdict.ok{background:var(--okb);color:var(--ok)}
.verdict.no{background:var(--waitb);color:var(--wait)}
.verdict span{display:block;font-weight:400;font-size:14.5px;margin-top:5px}
.score{font-family:Fraunces,serif;font-size:46px;font-weight:700;margin:0;line-height:1}
input[type=text]{
  width:100%;padding:14px;border-radius:11px;border:1.5px solid var(--line);
  font-family:inherit;font-size:20px;font-weight:700;background:#fff;color:var(--ink);
}
input[type=text]:disabled{opacity:1}
.unit{font-size:15px;color:var(--ink-soft);margin-left:8px}
.big-audio{width:100%;padding:24px 16px;border-radius:var(--r);border:2px solid var(--ink);background:#fff;font-size:19px;font-weight:700;cursor:pointer;margin-bottom:12px}
.big-audio small{display:block;font-weight:400;font-size:13.5px;color:var(--ink-soft);margin-top:5px}
.step{width:100%;text-align:left;padding:13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:16px;cursor:pointer;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
.step .num{font-weight:700;color:var(--a1);min-width:20px}
.step.picked{background:var(--a1b);border-color:var(--a1)}
.step.ko{background:var(--waitb);border-color:var(--wait)}

/* formule */
.fx{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.05em}
.fx sup,.fx sub{font-size:.68em;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:-.5em;text-align:center;margin:0 .18em}
.frac .nu{border-bottom:1.5px solid currentColor;padding:0 .28em}
.frac .de{padding:0 .28em}

/* modalità Scrivi */
.wbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.wbar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .25s}
.wcount{margin:0 0 14px;font-size:13px;color:var(--ink-soft)}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{border-radius:11px;padding:10px 12px;display:flex;align-items:baseline;gap:12px;border:2px solid transparent}
.slot .lab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85;min-width:96px}
.slot .word{font-size:23px;font-weight:700;letter-spacing:.06em;line-height:1.2;word-break:break-all}
.slot.f0{background:var(--a1b);color:var(--a1)}
.slot.f1{background:var(--a2b);color:var(--a2)}
.slot.f2{background:var(--a3b);color:var(--a3)}
.slot.waiting{opacity:.5}
.slot.active{border-color:currentColor}
.slot.solved{background:var(--okb);color:var(--ok)}
.slot.failed{background:var(--waitb);color:var(--wait)}
.slot .ghosts{opacity:.35;letter-spacing:.18em}
.slot .lok{color:var(--ok)}
.slot .lno{color:var(--wait);text-decoration:underline wavy}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.tile{width:52px;height:52px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
  font-size:24px;font-weight:700;color:var(--ink);cursor:pointer;text-transform:lowercase}
.tile.used{opacity:.22;border-style:dashed}
.cta:disabled{opacity:.4;cursor:default}
.bigchoice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-left:6px solid var(--a1);border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer}
.bigchoice .t{display:block;font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:700;line-height:1.1}
.bigchoice .b{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:5px}
.c-study{border-left-color:var(--a1)} .c-study .t{color:var(--a1)}
.c-drill{border-left-color:var(--a2)} .c-drill .t{color:var(--a2)}
.pips{display:flex;gap:5px;margin-bottom:7px}
.pips i{height:10px;flex:1;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.pips i.half::after{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--a2)}
.pips i.full{background:var(--ok)}
.pips i.ko{background:var(--wait)}
#typebar{margin-bottom:12px}
#typein{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--line);
  font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.1em;text-align:center;
  background:#fff;color:var(--ink-soft);text-transform:lowercase}
#typein::placeholder{color:var(--line);font-weight:400;letter-spacing:0;font-size:15px}
.caret{opacity:.55;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.focus{background:var(--a2b);color:var(--a2);padding:1px 5px;border-radius:5px;font-weight:700}
.stage{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.tapskip{cursor:pointer}
.tapskip .verdict{animation:none}
.sbar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.sbar .nm{min-width:108px;font-weight:700;font-size:13px}
.sbar .tr{flex:1;height:11px;background:var(--line);border-radius:6px;overflow:hidden}
.sbar .tr i{display:block;height:100%;border-radius:6px}
.sbar .vl{min-width:46px;text-align:right;color:var(--ink-soft);font-size:13px}
.hist{width:100%;font-size:14px;border-collapse:collapse}
.hist td{padding:6px 0;border-bottom:1px solid var(--line)}
.hist td:last-child{text-align:right;color:var(--ink-soft)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px;margin-bottom:14px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--a1)}
footer{margin-top:26px;font-size:12.5px;color:var(--ink-soft);text-align:center;padding-bottom:10px}
.err{background:var(--waitb);color:var(--wait);border-radius:var(--r);padding:13px 15px;font-size:14.5px;margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){
  .q,.card,.packbtn{animation:rise .2s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
:focus-visible{outline:3px solid var(--a3);outline-offset:2px}

/* ── pagina iniziale: tre materie ── */
.subjbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-left:7px solid var(--a1);border-radius:var(--r);
  padding:18px 16px;margin-bottom:12px;cursor:pointer;font:inherit;color:var(--ink)}
.subjbtn .n{flex:1}
.subjbtn .t{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:700;line-height:1.05}
.subjbtn .b{display:block;font-size:14px;color:var(--ink-soft);margin-top:4px}
.subjbtn.s-0{border-left-color:var(--a1)} .subjbtn.s-1{border-left-color:var(--a2)} .subjbtn.s-2{border-left-color:var(--a3)}
.tick{width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.tick.off{background:var(--line);color:var(--ink-soft)}
.vuoto{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;
  text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.5}
.fatto{display:flex;align-items:center;gap:10px;background:var(--okb);color:var(--ok);
  border-radius:var(--r);padding:14px 16px;margin:2px 0 14px;font-size:15px;font-weight:600}
.fatto b{font-size:20px}

/* ── allenamento di oggi ── */
.today{display:block;width:100%;text-align:left;border:0;border-radius:var(--r);
  background:linear-gradient(135deg,var(--ink),#22364a);color:#fff;padding:16px 18px;margin:2px 0 4px;font:inherit}
.today .t{display:block;font-family:Fraunces,Georgia,serif;font-size:25px;font-weight:700;line-height:1.1}
.today .b{display:block;font-size:14.5px;opacity:.82;margin-top:5px}
.today[disabled]{opacity:.55}
.streak{font-size:13px;color:var(--ink-soft);margin:0 0 16px;text-align:center}
/* ── risposta scritta ── */
#txtin{width:100%;font:inherit;font-size:21px;padding:12px 14px;border:2px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);text-align:center}
#txtin:focus{outline:none;border-color:var(--a1)}
.gapq{font-size:22px;line-height:1.45}
.gapq u{text-decoration:none;border-bottom:2.5px dashed var(--a1);padding:0 22px}
.verdict.sp{background:var(--waitb);color:var(--wait)}
.areatab{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
.areatab td{padding:5px 0;border-bottom:1px solid var(--line)}
.areatab td:last-child{text-align:right;white-space:nowrap}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <button class="back" id="back" hidden onclick="goBack()">‹ Indietro</button>
      <h1 id="title">Palestra</h1>
    </div>
    <p class="sub" id="subtitle">Esercizi di inglese, matematica e fisica</p>
    <div class="spine"><span class="sa"></span><span class="sb"></span><span class="sc"></span></div>
  </div>
</header>

<div class="wrap"><div id="app"></div>
<div id="typebar" hidden><input id="typein" type="text" inputmode="text" enterkeyhint="done"
  autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"
  placeholder="tocca qui e scrivi" oninput="onType(this)" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();checkForm();}"></div>
<footer id="foot"></footer></div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIGURAZIONE — cambia solo queste tre righe
   ═══════════════════════════════════════════════════════════ */
const GH = {
  user:   "denismolaro",
  repo:   "Esercizi",
  branch: "main"
};
/* ═════════════════════════════════════════════════════════ */

const APPVER = "13";   /* si vede in fondo alla pagina: serve a capire quale versione e online */
const SUBJECTS = ["Inglese","Matematica","Fisica"];
const $  = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = a => a[(Math.random()*a.length)|0];

/* registro per gli onclick: niente stringhe incollate negli attributi */
const REG = {entries:[], texts:[]};
function regEntry(e){ REG.entries.push(e); return REG.entries.length-1; }
function regText(t){ REG.texts.push(t); return REG.texts.length-1; }

/* ---------- memoria locale, tollerante ---------- */
const mem = {};
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} mem[k]=v; }
function load(k,d){
  try{ const s=localStorage.getItem(k); if(s!=null) return JSON.parse(s); }catch(e){}
  return (k in mem)?mem[k]:d;
}

/* ---------- formule: mini-notazione → HTML ---------- */
const GREEK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",epsilon:"ε",theta:"θ",lambda:"λ",mu:"μ",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",omega:"ω",Omega:"Ω"};
function fx(s){
  if(s==null) return "";
  let t = esc(s);
  t = t.replace(/\\(alpha|beta|gamma|delta|Delta|epsilon|theta|lambda|mu|pi|rho|sigma|tau|phi|omega|Omega)/g,(_,g)=>GREEK[g]);
  t = t.replace(/&lt;=/g,"≤").replace(/&gt;=/g,"≥").replace(/!=/g,"≠")
       .replace(/-&gt;/g,"→").replace(/=&gt;/g,"⇒").replace(/\+-/g,"±")
       .replace(/\bdeg\b/g,"°").replace(/\binf\b/g,"∞").replace(/\*/g,"·");
  t = t.replace(/sqrt\(([^()]*)\)/g,"√<span style='border-top:1.4px solid currentColor'>$1</span>");
  t = t.replace(/\(([^()]+)\)\/\(([^()]+)\)/g,"<span class='frac'><span class='nu'>$1</span><span class='de'>$2</span></span>");
  t = t.replace(/\^\{([^}]*)\}/g,"<sup>$1</sup>").replace(/\^(-?[A-Za-z0-9]+)/g,"<sup>$1</sup>");
  t = t.replace(/_\{([^}]*)\}/g,"<sub>$1</sub>").replace(/_(-?[A-Za-z0-9]+)/g,"<sub>$1</sub>");
  return "<span class='fx'>"+t+"</span>";
}

/* ---------- voce ---------- */
let voice=null, warmed=false;
function initVoices(){
  if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices()||[];
  voice = vs.find(v=>v.lang==="en-GB") || vs.find(v=>v.lang&&v.lang.indexOf("en-GB")===0)
       || vs.find(v=>v.lang&&v.lang.indexOf("en")===0) || null;
}
if("speechSynthesis" in window){ initVoices(); speechSynthesis.onvoiceschanged=initVoices; }
function warmUp(){                        /* iOS: la primissima voce a volte resta muta */
  if(warmed||!("speechSynthesis" in window)) return;
  warmed=true;
  const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u);
}
document.addEventListener("touchstart",warmUp,{once:true});
document.addEventListener("click",warmUp,{once:true});

const slow = () => load("slow",false);
function say(text,lang){
  if(!("speechSynthesis" in window)||!text) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang = lang || "en-GB";
  u.rate = slow()?0.55:0.82;
  if(voice && u.lang.indexOf("en")===0) u.voice=voice;

function sayList(arr,lang){

/* ═══════════ MEMORIA DEGLI ERRORI (ripetizione dilazionata) ═══════════
   recall → { "<chiave item>": {b:scatola, d:quando riproporlo} }
   Sbagliato → scatola 0, torna domani. Giusto → sale di scatola e torna piu tardi.   */
const BOXES=[1,2,4,8,16,32];          /* giorni di attesa per scatola */
const DAY=86400000;
function hash32(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); }
function itemKey(pid,it){
  if(it._ck) return it._ck;                     /* schede: chiave gia' stabile, verbo + forma */
  return pid+":"+hash32(String(it.q||it.prompt||it.sentence||"")+"|"+String(it.answer==null?"":it.answer));
}
/* I pacchetti a schede (i verbi irregolari) non hanno "items": le domande nascono
   dalle schede. Qui ne ricavo una voce per ogni forma derivata di ogni verbo,
   cosi anche loro entrano nel giro quotidiano e nella memoria degli errori.      */
function cardSpecs(pk){
  const c=pk.cards; if(!c||!c.fields||c.fields.length<2) return [];
  const out=[];
  allEntries(pk).forEach(e=>{
    for(let i=1;i<c.fields.length;i++){
      if(!e[c.fields[i].key]) continue;
      out.push({_card:true, _e:e, _fi:i, _ck:pk.id+":"+e[c.fields[0].key]+":"+c.fields[i].key});
    }
  });
  return out;
}
/* domanda autosufficiente: non dipende dal pacchetto aperto, quindi funziona
   anche nell'allenamento di oggi dove i pacchetti sono mescolati */
function mcFromSpec(pk,sp){
  const c=pk.cards, F=c.fields, e=sp._e, i=sp._fi;
  const correct=e[F[i].key], distr=[];
  for(const xx of shuffle(allEntries(pk))){
    const v=xx[F[i].key];
    if(v && v!==correct && distr.indexOf(v)<0) distr.push(v);
    if(distr.length===3) break;
  }
  const trio=F.map(f=>e[f.key]).join(" · ");
  return {type:"mc", _ck:sp._ck, color:i%3,
    lab:"Qual e "+F[i].label.toLowerCase()+" di questo verbo?",
    prompt:e[F[0].key],
    sub:(c.subField&&e[c.subField])?e[c.subField]:"",
    options:shuffle([correct].concat(distr)), answer:correct,
    speak:correct, why:"Le tre forme: "+trio+"."};
}
function recall(){ return load("recall",{})||{}; }
function recallSave(k,ok){
  if(!k) return;
  const R=recall(), r=R[k]||{b:0,d:0};
  r.b = ok ? Math.min(r.b+1,BOXES.length-1) : 0;
  r.d = Date.now() + BOXES[r.b]*DAY;
  if(!ok) r.d = Date.now() + DAY;
  R[k]=r; store("recall",R);
}
/* tutti gli item di inglese, divisi in: da rivedere / mai visti / gia sistemati */
function todayPool(){
  const now=Date.now(), R=recall(), due=[], fresh=[], later=[];
  PACKS.forEach(pk=>{
    if((pk.subject||"")!=="Inglese") return;
    const sorgente=(pk.items||[]).filter(z=>z.type!=="info").concat(cardSpecs(pk));
    sorgente.forEach(it=>{
      const k=itemKey(pk.id,it), r=R[k], o={pk:pk,it:it,k:k};
      if(!r) fresh.push(o); else if(r.d<=now) due.push(o); else later.push(o);
    });
  });
  return {due:due,fresh:fresh,later:later};
}
function todayCount(){ const t=todayPool(); return {due:t.due.length,fresh:t.fresh.length,tot:t.due.length+t.fresh.length+t.later.length}; }

function doneToday(){ const s=load("streak",{last:"",n:0})||{last:"",n:0}; return s.last===today8(); }

/* striscia di giorni consecutivi */
function today8(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function bumpStreak(){
  const s=load("streak",{last:"",n:0})||{last:"",n:0}, t=today8();
  if(s.last===t) return s;
  const y=new Date(Date.now()-DAY);
  const yst=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  const out={last:t, n:(s.last===yst? (s.n||0)+1 : 1)};
  store("streak",out); return out;
}

async function fetchPacks(force){
  const cached = load("packs",null);
  if(cached && cached.length){ PACKS=cached; loading=false; render(); }
  try{
    const api="https://api.github.com/repos/"+GH.user+"/"+GH.repo+"/contents/packs?ref="+GH.branch;

    const out=[];
    for(const f of files){
      try{

        if(!pr.ok) continue;
        const data=await pr.json();
        data._file=f.name;
        out.push(data);
      }catch(e){}

    if(out.length){
      out.sort((a,b)=>(SUBJECTS.indexOf(a.subject)-SUBJECTS.indexOf(b.subject))||String(a.title).localeCompare(b.title));

function qFromCards(p, entries){
  const c=p.cards, F=c.fields, all=allEntries(p);
  const e=pick(entries);
  const i = F.length>1 ? 1+((Math.random()*(F.length-1))|0) : 0;
  const reverse = F.length>1 && Math.random()<0.35;

  if(reverse){
    const correct=e[F[0].key], distr=[];
    for(const x of shuffle(all)){
      const v=x[F[0].key];
      if(v!==correct && distr.indexOf(v)<0) distr.push(v);
      if(distr.length===3) break;
    }
    return {type:"mc", lab:"Di quale verbo è questa forma?", prompt:e[F[i].key],
            sub:F[i].label, color:i%3, options:shuffle([correct].concat(distr)),
            answer:correct, entry:e};
  }
  const correct=e[F[i].key], distr=[];
  for(const x of shuffle(all)){
    const v=x[F[i].key];
    if(v!==correct && distr.indexOf(v)<0) distr.push(v);
    if(distr.length===3) break;
  }
  return {type:"mc", lab:"Qual è "+F[i].label.toLowerCase()+"?", prompt:e[F[0].key],
          sub:(c.subField?e[c.subField]:""), color:i%3,
          options:shuffle([correct].concat(distr)), answer:correct, entry:e};
}

/* ---------- risposta scritta ---------- */
const CONTR=[["do not","don't"],["does not","doesn't"],["did not","didn't"],
  ["is not","isn't"],["are not","aren't"],["am not","'m not"],["was not","wasn't"],["were not","weren't"],
  ["have not","haven't"],["has not","hasn't"],["had not","hadn't"],
  ["can not","can't"],["cannot","can't"],["could not","couldn't"],["will not","won't"],
  ["would not","wouldn't"],["should not","shouldn't"],["must not","mustn't"],
  ["i am","i'm"],["you are","you're"],["he is","he's"],["she is","she's"],["it is","it's"],
  ["we are","we're"],["they are","they're"],["that is","that's"],["there is","there's"],
  ["i have","i've"],["you have","you've"],["we have","we've"],["they have","they've"]];
function normTxt(s){
  return String(s==null?"":s).toLowerCase()
    .replace(/[\u2018\u2019\u02BC\u00B4`]/g,"'")
    .replace(/[.,!?;:]+$/,"")
    .replace(/\s+/g," ").trim();
}
function expandTxt(s){
  let t=" "+normTxt(s)+" ";
  CONTR.forEach(c=>{ t=t.split(" "+c[1]+" ").join(" "+c[0]+" "); });
  return t.trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=[],cur=[];
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur.slice();
  }
  return prev[n];
}
/* Parole che PORTANO la grammatica: pronomi, determinanti, ausiliari, quantificatori,
   forme irregolari, comparativi irregolari. Se il ragazzo ne scrive una al posto di
   un'altra non e' un errore di ortografia, e' un errore di grammatica: va segnato.
   Serve perche' "these"/"those" o "worse"/"worst" differiscono per una lettera sola. */
const GRAM=(" i you he she it we they me him her us them my your his its our their"
+" mine yours hers ours theirs myself yourself himself herself itself ourselves"
+" yourselves themselves each other one ones this that these those"
+" who what which whose where when why how"
+" am is are was were be been being do does did done have has had having"
+" can could will would shall should may might must"
+" not no none nobody nothing any some much many few little lot lots"
+" enough too very more most less least as than so such"
+" good better best bad worse worst well"
+" go goes going went gone write wrote written take took taken find found"
+" buy bought bring brought see saw seen come came make made say said"
+" get got give gave given know knew known think thought ring rang rung"
+" read run ran eat ate eaten drink drank speak spoke spoken meet met"
+" leave left put cut let sit sat stand stood tell told feel felt keep kept"
+" sleep slept teach taught catch caught pay paid send sent build built"
+" hold held break broke broken choose chose chosen drive drove driven"
+" fall fell fallen fly flew flown forget forgot forgotten grow grew grown"
+" hear heard lose lost mean meant ride rode ridden sell sold sing sang sung"
+" swim swam wear wore worn win won understand understood ").split(" ").filter(Boolean);
const GRAMSET={}; GRAM.forEach(w=>GRAMSET[w]=1);
function noApos(s){ return expandTxt(s).split("'").join(""); }
/* solo ortografia: prudente per scelta.
   "goes"/"go", "went"/"want", "these"/"those", "worse"/"worst", "writed"/"wrote"
   restano errori, perche' la differenza e' grammaticale e non di grafia. */
function onlySpelling(got,want){
  if(noApos(got)===noApos(want)) return true;      /* apostrofo dimenticato */
  const pairs=[[normTxt(got),normTxt(want)],[expandTxt(got),expandTxt(want)]];
  for(const pr of pairs){
    const A=pr[0].split(" "), B=pr[1].split(" ");
    if(A.length!==B.length) continue;
    let diff=false, ok=true;
    for(let i=0;i<B.length;i++){
      if(A[i]===B[i]) continue;
      const a=A[i], b=B[i];
      if(!a.length || GRAMSET[a]){ ok=false; break; }   /* ha scritto un'altra parola grammaticale */
      if(b.length<5){ ok=false; break; }
      if(a[0]!==b[0] || a[a.length-1]!==b[b.length-1]){ ok=false; break; }
      if(Math.abs(a.length-b.length)>2 || lev(a,b)>2){ ok=false; break; }
      diff=true;
    }
    if(ok&&diff) return true;
  }
  return false;
}
function txtOk(got,q){
  const cand=[q.answer].concat(q.alts||[]);
  for(const c of cand){ if(expandTxt(got)===expandTxt(c)) return "ok"; }
  for(const c of cand){ if(onlySpelling(got,c)) return "sp"; }
  return "no";
}
function answerTxt(){
  if(sess.answered) return;

}
function tapStep(k){

  const q=sess.items[sess.i];
  const at=q.picked.indexOf(k);
  if(at>=0) q.picked.splice(at,1); else q.picked.push(k);

    judge(ok,{q:String(q.q),given:"ordine sbagliato",want:"vedi la soluzione"});
  }else render();
}
function whS1q(q){ return q.s1q || "La parte evidenziata è il soggetto o l'oggetto?"; }
function whS1opts(q){ return q.s1options || ["Il soggetto — chi compie l'azione","L'oggetto — chi o cosa la subisce"]; }
function whS1ans(q){ return (q.s1answer!=null) ? q.s1answer : (q.kind==="subject"?0:1); }

function answerWh(stage,oi){

function reportText(){

    }else t+="\nNessun errore.";
    const o=overall();
    t+="\nComplessivo: "+seenList().length+"/"+writableAll().length+" verbi visti, "+o.pct+"% indovinati.";
    return t;
  }
  let t=pack.title+" — "+sess.right+"/"+sess.items.length+" ("+d+")";
  if(sess.wrong.length){
    t+="\nDa rivedere:";
    sess.wrong.slice(0,12).forEach(w=>{ t+="\n• "+w.q+" → ha messo «"+w.given+"», giusto «"+w.want+"»"; });
  }else t+="\nTutte giuste.";
  return t;
}

/* ═══════════ MEMORIA (localStorage, non cookie) ═══════════
   stats2 → { "buy": {att, ok, err} }
     att = quante volte il verbo è stato proposto
     ok  = quante volte tutte e tre le forme erano giuste
     err = quante forme sbagliate in totale
   last  → i verbi dell'ultima serie, per non riproporli
   forms → errori divisi fra base / past simple / past participle
   hist  → una riga per ogni serie completata                        */
/* Pause automatiche, in millisecondi. Toccando lo schermo si salta l'attesa. */
let PAUSE_OK      = 700;    /* forma giusta: basta un lampo di conferma */
let PAUSE_KO      = 2200;   /* forma sbagliata: c'e da leggere la grafia giusta */
let PAUSE_VERB_OK = 1000;   /* verbo giusto */
let PAUSE_VERB_KO = 2500;   /* verbo sbagliato: la scheda con le tre forme */
let   timer = null, voiceTimer = null;
function clearTimer(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(voiceTimer){ clearTimeout(voiceTimer); voiceTimer=null; }
}
/* breve suono discendente per l'errore, generato al volo: nessun file da scaricare */
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(), o=ctx.createOscillator(), gn=ctx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(233,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(117,ctx.currentTime+0.16);
    gn.gain.setValueAtTime(0.16,ctx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
    o.connect(gn); gn.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.22);
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} },700);
  }catch(e){}
}

const GOAL  = 80;   /* obiettivo: percentuale di verbi indovinati */
const SLEN  = 8;    /* verbi per serie, tutti diversi */

function statsKey(){ return "stats2:"+pack.id; }
function formsKey(){ return "forms:"+pack.id; }
function histKey(){  return "hist:"+pack.id; }
function lastKey(){  return "last:"+pack.id; }

function getStats(){ return load(statsKey(),null) || {}; }
function recordVerb(key,wrongForms){
  const st=getStats(), r=st[key]||{att:0,ok:0,err:0};
  r.att++;
  if(!wrongForms) r.ok++;
  r.err += wrongForms;
  st[key]=r; store(statsKey(),st);
}
function addForms(arr){
  const cur=load(formsKey(),null)||[0,0,0];
  for(let i=0;i<arr.length;i++) cur[i]=(cur[i]||0)+(arr[i]||0);
  store(formsKey(),cur);
}
function pushHist(rec){
  const h=load(histKey(),null)||[];
  h.unshift(rec); store(histKey(),h.slice(0,40));
}
function resetProgress(){
  if(!confirm("Azzero tutti i progressi di questo argomento. Sicuro?")) return;
  store(statsKey(),{}); store(formsKey(),[0,0,0]); store(histKey(),[]); store(lastKey(),[]);
  store("prog:"+pack.id,{best:0,runs:0,last:0});
  view="pack"; render();
}

function writableAll(){
  const F=pack.cards.fields;
  return allEntries(pack).filter(e=>F.every(f=>/^[A-Za-z]+$/.test(String(e[f.key]||""))));
}
function vkey(e){ return e[pack.cards.fields[0].key]; }
function rate(r){ return (r&&r.att) ? r.ok/r.att : 0; }
function overall(){
  const st=getStats(); let a=0,o=0;
  for(const k in st){ a+=st[k].att||0; o+=st[k].ok||0; }
  return { att:a, ok:o, pct: a?Math.round(o/a*100):0 };
}
function seenList(){
  const st=getStats();
  return writableAll().filter(e=>st[vkey(e)]);
}
function goalDone(){
  const o=overall();
  return o.att>0 && o.pct>=GOAL && seenList().length===writableAll().length;
}

/* Gli 8 verbi della prossima serie:
   1 già sbagliato in passato (il più incerto) + 7 mai visti.
   Quando i nuovi finiscono, subentrano i verbi con la percentuale più bassa.
   In ogni caso: 8 verbi diversi, e si evita la serie appena fatta. */
function pickSession(n){
  const st=getStats(), pool=writableAll();
  const prev=load(lastKey(),null)||[];
  const picks=[], used={};
  const take=e=>{ if(!used[vkey(e)]){ used[vkey(e)]=1; picks.push(e); } };

  const wrong=pool.filter(e=>{ const r=st[vkey(e)]; return r && r.att>0 && r.ok<r.att; })
                  .sort((a,b)=>rate(st[vkey(a)])-rate(st[vkey(b)]));
  if(wrong.length) take(wrong[0]);

  for(const e of shuffle(pool.filter(e=>!st[vkey(e)]))){
    if(picks.length>=n) break; take(e);
  }
  if(picks.length<n){
    const rest=pool.filter(e=>!used[vkey(e)] && prev.indexOf(vkey(e))<0)
                   .sort((a,b)=>rate(st[vkey(a)])-rate(st[vkey(b)]));
    for(const e of rest){ if(picks.length>=n) break; take(e); }
  }
  if(picks.length<n){
    for(const e of shuffle(pool)){ if(picks.length>=n) break; take(e); }
  }
  return shuffle(picks).slice(0,n);
}

/* ═══════════ MODALITÀ ESERCITATI ═══════════ */
function promptFor(e){
  const c=pack.cards;
  return c.subField ? e[c.subField] : e[c.fields[c.fields.length-1].key];
}
function targetFields(){
  const c=pack.cards;
  return c.subField ? c.fields : c.fields.slice(0,-1);
}
function startWrite(){
  clearTimer();
  const ent=pickSession(SLEN);
  if(!ent.length){ alert("Non ci sono voci adatte alla scrittura."); return; }
  saved=false;
  sess={ mode:"write",
         list:ent.map(e=>({e:e, wrong:0, allOk:null})),
         i:0, cur:null, last:null, errByForm:[0,0,0], stopped:false };
  loadCur(); view="session"; render();
}
function curItem(){ return sess.list[sess.i]; }
function loadCur(){
  const it=curItem();
  if(!it){ sess.cur=null; return; }
  const F=targetFields();
  sess.cur={ fi:0, typed:"", result:null, done:[] };
}
function onType(el){
  const cur=sess&&sess.cur, it=cur&&curItem();
  if(!cur||!it||cur.result!==null) return;
  const target=String(it.e[targetFields()[cur.fi].key]);
  const v=el.value.toLowerCase().replace(/[^a-z]/g,"").slice(0,target.length);
  if(el.value!==v) el.value=v;
  cur.typed=v;
  paintTyped();
}
/* aggiorna solo la casella e il pulsante: ridisegnare tutto farebbe
   perdere il fuoco al campo e su iPad chiuderebbe la tastiera */
function paintTyped(){
  const cur=sess&&sess.cur, it=cur&&curItem();
  if(!cur||!it) return;
  const target=String(it.e[targetFields()[cur.fi].key]), tl=target.toLowerCase();
  const w=document.getElementById("typeword");
  if(w) w.innerHTML = cur.typed.split("").map((ch,k)=>
        '<b class="'+(ch===tl[k]?"lok":"lno")+'">'+esc(ch)+'</b>').join("")
      + (cur.typed.length<target.length?'<span class="caret">|</span>':"")
      + '<span class="ghosts">'+"\u00b7".repeat(Math.max(0,target.length-cur.typed.length))+'</span>';
  const b=document.getElementById("checkbtn");
  if(b) b.disabled = cur.typed.length!==target.length;
}
function checkForm(){
  const cur=sess.cur, it=curItem(), F=targetFields();
  if(!cur||!it||cur.result!==null) return;
  const target=String(it.e[F[cur.fi].key]).toLowerCase();
  if(cur.typed.length!==target.length) return;
  cur.result = (cur.typed===target);
  if(!cur.result){ it.wrong++; sess.errByForm[cur.fi]=(sess.errByForm[cur.fi]||0)+1; }
  render();
  clearTimer();
  const suono = pack.cards.speak ? fieldSound(it.e,cur.fi) : null;
  if(cur.result){
    /* la voce parte dentro il gesto dell'utente: su iPad una pronuncia
       avviata da un timer verrebbe zittita dal sistema */
    if(suono) say(suono, pack.lang);
    timer=setTimeout(nextForm, PAUSE_OK);
  }else{
    beep();
    if(suono) voiceTimer=setTimeout(()=>say(suono, pack.lang), 380);
    /* nessun avanzamento automatico: si aspetta il tocco */
  }
}
function nextForm(){
  clearTimer();
  if(!sess || sess.mode!=="write" || !sess.cur) return;
  const cur=sess.cur, it=curItem(), F=targetFields();
  cur.done.push(cur.result);
  if(cur.fi+1 < F.length){
    cur.fi++; cur.typed=""; cur.result=null;
    render(); return;
  }
  it.allOk = cur.done.every(Boolean);
  recordVerb(vkey(it.e), it.wrong);
  sess.last={ e:it.e, allOk:it.allOk };
  sess.cur=null; render();
  timer=setTimeout(continueWrite, it.allOk ? PAUSE_VERB_OK : PAUSE_VERB_KO);
}
function continueWrite(){
  clearTimer();
  if(!sess || sess.mode!=="write" || !sess.last) return;
  sess.last=null; sess.i++;
  if(sess.i<sess.list.length) loadCur(); else sess.cur=null;
  render();
}
function stopWrite(){ clearTimer(); sess.stopped=true; sess.cur=null; sess.last=null; render(); }

function goalBars(){
  const pool=writableAll(), seen=seenList().length, o=overall();

    +'<span class="tr"><i style="width:'+Math.round(seen/pool.length*100)+'%;background:var(--a1)"></i></span>'
    +'<span class="vl">'+seen+'/'+pool.length+'</span></div>';
  h+='<div class="sbar"><span class="nm">Risposte giuste</span>'
    +'<span class="tr"><i style="width:'+Math.min(100,o.pct)+'%;background:var(--'
    +(o.pct>=GOAL?"ok":"a2")+')"></i></span>'
    +'<span class="vl">'+o.pct+'%</span></div>';
  h+='<p class="wcount">Obiettivo: '+GOAL+'% di verbi indovinati e tutti i verbi visti almeno una volta.</p>';

function vWrite(){

    return h;
  }

  /* ── pallini: uno per verbo, otto verbi diversi ── */
  let h='<div class="pips">'+sess.list.map(x=>
      x.allOk===null ? '<i></i>' : (x.allOk?'<i class="full"></i>':'<i class="ko"></i>')
    ).join("")+'</div>';
  h+='<p class="wcount">Verbo '+Math.min(sess.i+1,sess.list.length)+' di '+sess.list.length
    +' · '+right+' giusti finora</p>';

  /* ── verdetto sul verbo ── */
  if(sess.last){
    const L=sess.last;
    h+='<div class="tapskip" onclick="continueWrite()">'
      +'<div class="verdict '+(L.allOk?"ok":"no")+'">'
      +(L.allOk?"Tutte e tre giuste.":"Questo verbo va rivisto.")+'</div>';
    h+=entryCardHTML(L.e,true);
    h+='</div>';

  h+='<div class="slots">';
  F.forEach((f,i)=>{
    let content, cls="slot f"+(i%3);
    if(i<cur.fi){
      content=esc(it.e[f.key]); cls+=cur.done[i]?" solved":" failed";
    }else if(i===cur.fi){
      cls+=" active";
      const tl=target.toLowerCase();
      const marked = cur.typed.split("").map((ch,k)=>
          '<b class="'+(ch===tl[k]?"lok":"lno")+'">'+esc(ch)+'</b>').join("");
      if(cur.result===null){

                + '<span class="ghosts">'+"·".repeat(Math.max(0,target.length-cur.typed.length))+'</span></span>';
      }else if(cur.result){

    }
    return h;
  }

  h+='<button class="cta" id="checkbtn" onclick="checkForm()"'
    +(cur.typed.length===target.length?"":" disabled")+'>Controlla</button>';
  h+='<button class="linkish" style="display:block;margin:14px auto 0" onclick="stopWrite()">Basta per oggi</button>';
  return h;
}

      +'</div>';
  });
  if(hasItems) h+='<button class="cta" onclick="startSession(&#39;items&#39;)">Esercitati</button>';
  return h;
}

function vStudy(){
  const c=pack.cards;
  let h="";
  if(c.groups){
    h+='<div class="groups">';
    c.groups.forEach((g,i)=>{
      h+='<button class="chip" aria-pressed="'+(i===groupIdx)+'" onclick="groupIdx='+i+';render()">'+(i+1)+'. '+esc(g.name)+'</button>';
    });
    h+='</div>';
    if(c.groups[groupIdx].hint) h+='<div class="note">'+c.groups[groupIdx].hint+'</div>';
  }
  h+='<p class="wcount" style="margin-bottom:10px">Tocca una forma per sentire come si pronuncia.</p>';
  cardEntries().forEach(e=>{ h+=entryCardHTML(e); });
  return h;
}

function vStats(){
  const F=pack.cards.fields, st=getStats(), pool=writableAll();
  const forms=load(formsKey(),null)||[0,0,0];
  const hist=load(histKey(),null)||[];
  const o=overall();

  let h='<div class="card">';
  if(goalDone()) h+='<div class="verdict ok" style="margin-bottom:12px">Obiettivo raggiunto.</div>';
  h+='<div class="meaning"><b>L&#39;obiettivo</b></div><div style="margin-top:8px">'+goalBars()+'</div></div>';

  const tot=forms.reduce((a,b)=>a+b,0);
  h+='<div class="card"><div class="meaning"><b>Dove si perde di più</b></div>';
  if(tot){
    const mx=Math.max.apply(null,forms.concat([1]));
    F.forEach((f,i)=>{
      const v=forms[i]||0;
      h+='<div class="sbar"><span class="nm" style="color:var(--a'+((i%3)+1)+')">'+esc(f.label)+'</span>'
        +'<span class="tr"><i style="width:'+Math.round(v/mx*100)+'%;background:var(--a'+((i%3)+1)+')"></i></span>'
        +'<span class="vl">'+Math.round(v/tot*100)+'%</span></div>';
    });
    h+='<p class="wcount" style="margin-top:8px">'+tot+' forme sbagliate in tutto, divise fra le tre colonne.</p>';
  }else h+='<p class="wcount" style="margin-top:6px">Ancora nessun errore registrato.</p>';
  h+='</div>';

  const done=pool.filter(e=>st[vkey(e)])
                 .sort((a,b)=>rate(st[vkey(a)])-rate(st[vkey(b)]) || vkey(a).localeCompare(vkey(b)));
  h+='<div class="card"><div class="meaning"><b>Verbo per verbo</b></div>'
    +'<p class="wcount" style="margin:4px 0 8px">'+done.length+' esercitati, dal più incerto al più sicuro.</p>';
  if(done.length){
    h+='<table class="hist"><tbody>';
    done.forEach(e=>{
      const r=st[vkey(e)], p=Math.round(rate(r)*100);
      const col = p>=GOAL ? "var(--ok)" : p>=50 ? "var(--a2)" : "var(--wait)";
      h+='<tr><td><b>'+esc(vkey(e))+'</b> <span style="color:var(--ink-soft)">— '
        +esc(e[pack.cards.subField]||"")+'</span></td>'
        +'<td style="white-space:nowrap"><b style="color:'+col+'">'+p+'%</b> '
        +'<span style="color:var(--ink-soft);font-size:12.5px">('+r.ok+'/'+r.att+')</span></td></tr>';
    });
    h+='</tbody></table>';
  }
  const never=pool.length-done.length;
  if(never) h+='<p class="wcount" style="margin-top:10px">Mancano ancora '+never+' verbi mai visti.</p>';
  h+='</div>';

  if(hist.length){
    h+='<div class="card"><div class="meaning"><b>Le serie fatte</b></div><table class="hist"><tbody>';
    hist.slice(0,15).forEach(r=>{
      const d=new Date(r.d);
      h+='<tr><td>'+d.toLocaleDateString("it-IT")+' '
        +String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</td>'
        +'<td>'+r.r+'/'+r.n+' verbi'+(r.err?' · '+r.err+' forme sbagliate':' · nessun errore')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  h+='<button class="cta" onclick="shareStats()">Manda le statistiche a papà</button>'
    +'<button class="cta ghost small" style="margin-top:8px" onclick="resetProgress()">Azzera i progressi</button>';
  return h;
}

async function shareStats(){
  const F=pack.cards.fields, st=getStats(), pool=writableAll();
  const forms=load(formsKey(),null)||[0,0,0];
  const hist=load(histKey(),null)||[];
  const o=overall(), seen=seenList().length;
  const tot=forms.reduce((a,b)=>a+b,0);

  let t=pack.title+" — statistiche al "+new Date().toLocaleDateString("it-IT")
    +"\nVerbi visti: "+seen+" su "+pool.length
    +"\nVerbi indovinati: "+o.pct+"% (obiettivo "+GOAL+"%)"
    +"\nSerie fatte: "+hist.length;
  if(goalDone()) t+="\nObiettivo raggiunto.";
  if(tot){
    t+="\nForme sbagliate:";
    F.forEach((f,i)=>{ t+="\n  "+f.label+": "+(forms[i]||0)+" ("+Math.round((forms[i]||0)/tot*100)+"%)"; });
  }
  const weak=pool.filter(e=>st[vkey(e)] && rate(st[vkey(e)])<GOAL/100)
                 .sort((a,b)=>rate(st[vkey(a)])-rate(st[vkey(b)]));
  if(weak.length){
    t+="\nSotto il "+GOAL+"%:";
    weak.slice(0,15).forEach(e=>{
      const r=st[vkey(e)];
      t+="\n  "+vkey(e)+" "+Math.round(rate(r)*100)+"% ("+r.ok+"/"+r.att+")";
    });
    if(weak.length>15) t+="\n  ...e altri "+(weak.length-15);
  }
  try{
    if(navigator.share){ await navigator.share({text:t}); return; }
    await navigator.clipboard.writeText(t);
    alert("Statistiche copiate. Incollale nel messaggio a papà.");
  }catch(e){ alert(t); }
}

function vSession(){
  if(sess.mode==="write") return vWrite();
  const s=sess;
  if(s.i>=s.items.length){
    saveResult();
    if(s.mode==="today" && !s.streaked){ s.streaked=true; bumpStreak(); }
    const n=s.items.length, r=s.right;
    const msg = r===n ? "Tutte giuste. Questo pezzo lo sai."
      : r>=n*0.75 ? "Molto bene. Mancano un paio di dettagli."
      : r>=n*0.5  ? "Metà è a posto. Rifai il giro."
      : "Questo è ancora nuovo. Guardalo con calma e riprova.";
    let h='<div class="q center"><p class="score">'+r+'<span style="font-size:22px;color:var(--ink-soft)"> / '+n+'</span></p>'
        +'<p class="qsub" style="margin-top:8px">'+msg+'</p></div>';
    if(s.whErr1!=null || s.whErr2!=null){
      const e1=s.whErr1||0, e2=s.whErr2||0;
      h+='<div class="card"><div class="meaning"><b>Dove si è perso</b></div>'
        +'<p class="wcount" style="margin-top:8px">Primo passo (capire la frase): '+e1+(e1===1?' errore':' errori')
        +'<br>Secondo passo (scegliere la forma): '+e2+(e2===1?' errore':' errori')+'</p></div>';
    }
    /* se gli item dichiarano un'area, la resa va spezzata per area: serve al diagnostico */
    const aree={};
    s.items.forEach(it=>{ if(it.area){ const a=aree[it.area]=aree[it.area]||{n:0,ok:0}; a.n++; if(it._ok) a.ok++; } });
    const nomiAree=Object.keys(aree);
    if(nomiAree.length>1){
      h+='<div class="card"><div class="meaning"><b>Per argomento</b></div><table class="areatab"><tbody>';
      nomiAree.sort((a,b)=>(aree[a].ok/aree[a].n)-(aree[b].ok/aree[b].n)).forEach(a=>{
        const o=aree[a], pc=Math.round(o.ok/o.n*100);
        const col = pc>=75?"var(--ok)" : pc>=50?"var(--wait)" : "#B3261E";
        h+='<tr><td>'+esc(a)+'</td><td><b style="color:'+col+'">'+pc+'%</b> '
          +'<span style="color:var(--ink-soft);font-size:12.5px">('+o.ok+'/'+o.n+')</span></td></tr>';
      });
      h+='</tbody></table></div>';
    }
    if(s.wrong.length){
      h+='<div class="card"><div class="meaning"><b>Da rivedere</b></div><ul style="margin:8px 0 0;padding-left:20px;font-size:15px">';
      s.wrong.forEach(w=>{ h+='<li style="margin-bottom:4px">'+esc(w.q)+' → giusto: <b>'+esc(w.want)+'</b></li>'; });
      h+='</ul></div>';
    }
    h+='<button class="cta" onclick="shareReport()">Manda il riepilogo a papà</button>'
     + '<div class="row" style="margin-top:8px">'
     + '<button class="cta ghost" onclick="'+(s.mode==="today"?"startToday()":"startSession(&#39;"+s.mode+"&#39;)")+'">Un altro giro</button>'
     + '<button class="cta ghost" onclick="'+(s.mode==="today"?"backToSubject()":"backToPack()")+'">'
     + (s.mode==="today"?"Torna a Inglese":"Torna al ripasso")+'</button></div>';
    return h;
  }

  const q=s.items[s.i];
  const accent=["--a1","--a2","--a3"][q.color!=null?q.color:0];
  let h='<div class="dots">'+s.items.map((_,i)=>'<i class="'+(i<s.i?"done":i===s.i?"now":"")+'"></i>').join("")+'</div>';

  if(q.type==="listen"){
    const c=pack.cards, e=q.entry;
    h+='<button class="big-audio" onclick="saySlot('+regText(fieldSound(e,q.fi))+')">🔊 Ascolta'
      +'<small>'+esc(e[c.fields[0].key])+(c.subField?" — "+esc(e[c.subField]):"")+'</small></button>';
    h+='<div class="trio" style="grid-template-columns:repeat('+c.fields.length+',1fr)">';
    c.fields.forEach((f,i)=>{
      const mark = s.answered && i===q.fi ? ' style="outline:3px solid var(--ok)"' : "";
      h+='<button class="form f'+(i%3)+'"'+mark+' onclick="answerListen('+i+')">'
        +'<span class="lab">'+esc(f.label)+'</span><span class="word">'+esc(e[f.key])+'</span></button>';
    });
    h+='</div>';
  }
  else if(q.type==="wh"){
    const ev = q.focus ? esc(q.sentence).replace(esc(q.focus),'<span class="focus">'+esc(q.focus)+'</span>')
                       : esc(q.sentence);
    h+='<div class="q"><div class="stage">La frase di partenza</div>'
      +'<p class="qbig" style="font-size:21px;line-height:1.35">'+ev+'</p>'
      +(q.hint?'<p class="qsub">'+esc(q.hint)+'</p>':(q.focus?'<p class="qsub">La domanda deve chiedere della parte evidenziata.</p>':""))+'</div>';
    if(q.stage===1){
      h+='<div class="q"><div class="stage" style="color:var(--a1)">Primo passo</div>'
        +'<p class="qsub" style="font-size:16px;color:var(--ink)">'+esc(whS1q(q))+'</p></div>';
      h+='<div class="opts">';
      whS1opts(q).forEach((t,i)=>{
        let cls="opt";
        if(q.s1picked!=null) cls += (i===whS1ans(q)) ? " right" : (i===q.s1picked ? " wrongpick" : " dim");
        h+='<button class="'+cls+'" style="font-size:16px"'+(q.s1picked!=null?" disabled":"")
          +' onclick="answerWh(1,'+i+')">'+esc(t)+'</button>';
      });
      h+='</div>';
      if(q.s1picked!=null){
        h+='<div class="verdict '+(q.s1ok?"ok":"no")+'" style="margin-top:12px">'
          +(q.s1ok?"Esatto.":"Non ci siamo.")+'<span>'+esc(q.whyKind)+'</span></div>'
          +'<button class="cta" onclick="whNext()">Ora completa la domanda</button>';
      }
      return h;
    }
    h+='<div class="q"><div class="stage" style="color:var(--a3)">Secondo passo'
      +(q.kind?" — "+(q.kind==="subject"?"domanda sul soggetto":"domanda sull&#39;oggetto"):"")+'</div>'
      +'<p class="qbig" style="font-size:23px">'+esc(q.q)+'</p></div><div class="opts">';
    q.options.forEach((o,oi)=>{
      let cls="opt";
      if(s.answered){ cls += (o===q.answer) ? " right" : (o===s.picked ? " wrongpick" : " dim"); }
      h+='<button class="'+cls+'"'+(s.answered?" disabled":"")+' onclick="answerWh(2,'+oi+')">'+esc(o)+'</button>';
    });
    h+='</div>';
  }
  else if(q.type==="mc"){
    h+='<div class="q"><div class="qlab" style="color:var('+accent+')">'+esc(q.lab||q.q||"")+'</div>'
      +'<p class="qbig">'+(q.fxPrompt?fx(q.prompt||q.q):esc(q.prompt||q.q))+'</p>'
      +(q.sub?'<p class="qsub">'+esc(q.sub)+'</p>':"")
      +(q.speak?'<button class="linkish" onclick="saySlot('+regText(q.speak)+')">▶ Ascolta</button>':"")
      +'</div><div class="opts">';
    q.options.forEach((o,oi)=>{
      let cls="opt";
      if(s.answered){ cls += (o===q.answer) ? " right" : (o===s.picked ? " wrongpick" : " dim"); }
      h+='<button class="'+cls+'"'+(s.answered?" disabled":"")+' onclick="answerMC('+oi+')">'
        +(q.fxOptions?fx(o):esc(o))+'</button>';
    });
    h+='</div>';
  }
  else if(q.type==="num"){
    h+='<div class="q"><div class="qlab" style="color:var('+accent+')">Risposta numerica</div>'
      +'<p class="qbig">'+fx(q.q)+'</p>'+(q.sub?'<p class="qsub">'+fx(q.sub)+'</p>':"")+'</div>'
      +'<div class="card"><div style="display:flex;align-items:center">'
      +'<input type="text" id="numin" inputmode="decimal" autocomplete="off" placeholder="…" value="'
      +(s.answered?esc(s.picked||""):"")+'"'+(s.answered?" disabled":"")+'>'
      +(q.unit?'<span class="unit">'+fx(q.unit)+'</span>':"")+'</div></div>';
    if(!s.answered) h+='<button class="cta" onclick="answerNum()">Controlla</button>';
  }
  else if(q.type==="txt"){
    const testo = String(q.q||"").indexOf("___")>=0
      ? esc(q.q).split("___").join("<u>&nbsp;</u>")
      : esc(q.q);
    h+='<div class="q"><div class="qlab" style="color:var('+accent+')">'+esc(q.lab||"Scrivi la risposta")+'</div>'
      +'<p class="gapq">'+testo+'</p>'
      +(q.sub?'<p class="qsub">'+esc(q.sub)+'</p>':"")
      +(q.speak?'<button class="linkish" onclick="saySlot('+regText(q.speak)+')">&#9654; Ascolta</button>':"")
      +'</div>';
    h+='<div class="card"><input type="text" id="txtin" autocomplete="off" autocapitalize="off"'
      +' autocorrect="off" spellcheck="false" inputmode="text" placeholder="scrivi qui"'
      +' onkeydown="if(event.key===\'Enter\'){event.preventDefault();answerTxt();}" value="'
      +(s.answered?esc(s.picked||""):"")+'"'+(s.answered?" disabled":"")+'></div>';
    if(!s.answered) h+='<button class="cta" onclick="answerTxt()">Controlla</button>';
    else h+='<div class="card" style="text-align:center"><div class="meaning"><b>'+esc(q.answer)+'</b></div></div>';
  }
  else if(q.type==="order"){
    h+='<div class="q"><div class="qlab" style="color:var('+accent+')">Metti in ordine</div>'
      +'<p class="qbig" style="font-size:22px">'+fx(q.q)+'</p></div>';
    q.shuffled.forEach((st,k)=>{
      const pos=q.picked.indexOf(k);
      h+='<button class="step'+(pos>=0?" picked":"")+'"'+(s.answered?" disabled":"")+' onclick="tapStep('+k+')">'
        +'<span class="num">'+(pos>=0?pos+1:"·")+'</span><span>'+fx(st.s)+'</span></button>';
    });
    if(s.answered){
      h+='<div class="card"><div class="meaning"><b>Ordine giusto</b></div><ol style="margin:8px 0 0;padding-left:22px">';
      q.steps.forEach(st=>{ h+='<li style="margin-bottom:4px">'+fx(st)+'</li>'; });
      h+='</ol></div>';
    }
  }

  if(s.answered){
    const cls = s.lastSpell ? "sp" : (s.lastOk?"ok":"no");
    const cap = s.lastSpell ? "La struttura è giusta. Guarda come si scrive."
              : (s.lastOk?pick(PRAISE):"Non ancora.");
    h+='<div class="verdict '+cls+'" style="margin-top:12px">'+cap
      +(q.why?'<span>'+fx(q.why)+'</span>':"")+'</div>';
    if(q.entry) h+=entryCardHTML(q.entry);
    h+='<button class="cta" onclick="nextQ()">'+(s.i===s.items.length-1?"Vedi il risultato":"Avanti")+'</button>';
  }
  return h;
}

/* ═══════════ RENDER ═══════════ */
function render(){
  REG.entries=[]; REG.texts=[];
  const b=$("#back"), t=$("#title"), st=$("#subtitle");
  if(view==="home"){
    b.hidden=true; t.textContent="Palestra";
    st.textContent="Esercizi di inglese, matematica e fisica";
  }else if(view==="subject"){
    b.hidden=false; t.textContent=subject; st.textContent="Scegli cosa fare";
  }else{
    b.hidden=false;
    t.textContent = pack ? pack.title : "Palestra";
    st.textContent = (sess && sess.mode==="today") ? "Inglese, ogni giorno"
      : view==="study" ? "Studia" : view==="session" ? "Esercitati" : view==="stats" ? "Statistiche" : (pack?pack.subject:"");
  }
  $("#app").innerHTML = view==="home" ? vHome()
    : view==="subject" ? vSubject()
    : view==="pack" ? vPack()
    : view==="study" ? vStudy()
    : view==="stats" ? vStats() : vSession();
  $("#foot").textContent = ((view==="subject" && packsOf(subject).length) ? packsOf(subject).length+" argomenti · " : "") + "versione "+APPVER;
  window.scrollTo(0,0);
  const ni=$("#numin")||$("#txtin");
  if(ni && sess && !sess.answered){ try{ ni.focus({preventScroll:true}); }catch(e){} }
  const bar=$("#typebar"), inp=$("#typein");
  const scrive = view==="session" && sess && sess.mode==="write" && sess.cur && sess.cur.result===null;
  if(bar) bar.hidden = !scrive;
  if(scrive && inp){
    if(inp.value !== sess.cur.typed) inp.value = sess.cur.typed;
    try{ inp.focus({preventScroll:true}); }catch(e){}
  }
}
function goBack(){
  if(pack && pack.id==="__oggi"){ backToSubject(); return; }
  if(view==='session'||view==='study'||view==='stats'){ backToPack(); return; }
  if(view==='pack'){ backToSubject(); return; }
  goHome();
}

/* avvio */
fetchPacks(false);
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
